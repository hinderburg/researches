<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HEXBand — прототип</title>
<meta name="description" content="HEXBand: пошаговая PvP-тактика на гексах — захват территории, колода манёвров, бой при соседстве.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="setup">
    <header class="setup-head">
      <div>
        <h1>HEXBand <span id="setup-version" class="muted"></span></h1>
        <p class="muted">Захват территории × колода манёвров × бой при соседстве.</p>
      </div>
      <div class="row"><button class="btn ghost" id="btn-intro">Основы</button><button class="btn ghost" id="btn-help">Правила</button></div>
    </header>

    <div class="setup-grid">
      <div class="setup-col">
        <h3>Режим</h3>
        <label class="radio"><input type="radio" name="mode" value="bot" checked> Против бота</label>
        <label class="radio"><input type="radio" name="mode" value="hotseat"> Два игрока на одном устройстве</label>
        <div id="bot-preset-row" class="field">
          <label for="sel-bot-preset">Колода бота</label>
          <select id="sel-bot-preset">
            <option value="balanced">Сбалансированная</option>
            <option value="expansion">Экспансия</option>
            <option value="duel">Дуэль</option>
            <option value="swarm">Орда</option>
          </select>
        </div>
        <div class="field">
          <label for="sel-rounds">Лимит раундов</label>
          <select id="sel-rounds"><option>8</option><option>10</option><option>12</option><option>16</option></select>
        </div>
        <div class="field">
          <label for="sel-attacks">Атак за ход на отряд</label>
          <select id="sel-attacks"><option value="1">1 (по умолчанию)</option><option value="2">2</option><option value="0">без лимита</option></select>
        </div>
        <div class="field">
          <label for="inp-seed">Seed (пусто — случайный)</label>
          <input id="inp-seed" type="text" inputmode="numeric" placeholder="например 42">
        </div>
      </div>
      <div class="setup-col builders">
        <div id="builder-1" class="builder"></div>
        <div id="builder-2" class="builder" hidden></div>
      </div>
    </div>

    <footer class="setup-foot">
      <span id="setup-hint" class="muted"></span>
      <button class="btn primary" id="btn-start">Начать матч</button>
    </footer>
    <p class="muted docs-link">Документация: <a href="docs/index.html">GDD, журнал решений, история изменений</a> · <a href="sim.html">симуляция баланса</a></p>
  </section>

  <section id="game" hidden>
    <header class="hud">
      <div class="hud-side p1" id="hud-1">
        <span class="hud-name">Синие</span>
        <span class="hud-stats"><b class="hud-terr">0</b> <span class="hud-pct">(0%)</span> · <b class="hud-min">24</b>⚔ · <span class="hud-poi">0</span>⚑</span>
      </div>
      <div class="hud-center">
        <span id="hud-round">Раунд 1</span>
        <button class="btn tiny ghost" id="btn-help-game">?</button><button class="btn tiny ghost" id="btn-quit">≡</button>
      </div>
      <div class="hud-side p2" id="hud-2">
        <span class="hud-stats"><span class="hud-poi">0</span>⚑ · <b class="hud-min">24</b>⚔ · <span class="hud-pct">(0%)</span> <b class="hud-terr">0</b></span>
        <span class="hud-name">Красные</span>
      </div>
    </header>

    <div id="board-wrap"><canvas id="board"></canvas></div>

    <div id="hand-area">
      <div id="card-desc" hidden></div>
      <div id="hand-row">
        <div class="pile-col"><div class="pile-count" id="discard-count">0</div><div class="pile discard" id="pile-discard"></div><div class="pile-label">сброс</div></div>
        <div id="hand-frame"><div id="hand"></div></div>
        <div class="pile-col"><div class="pile-count" id="deck-count">0</div><div class="pile deck" id="pile-deck"></div><div class="pile-label">колода</div></div>
      </div>
      <div id="status-row"><span id="status-line" class="muted"></span><button class="btn tiny ghost" id="btn-pass" hidden>Нет ходов — сбросить карту</button></div>
    </div>

    <details id="log"><summary>Журнал матча</summary><div id="log-lines"></div></details>
  </section>

  <div id="drag-fx" hidden></div>
  <div id="overlay" hidden></div>
</div>

<script src="js/config.js"></script>
<script src="js/hex.js"></script>
<script src="js/cards.js"></script>
<script src="js/icons.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
