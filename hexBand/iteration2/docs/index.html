<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXBand — документация</title>
<style>
  body { margin: 0; background: #15151a; color: #e8e4dc; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; background: #1f1f26; border-bottom: 1px solid #34343d; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  header a, header button { font: inherit; color: #e8e4dc; background: transparent; border: 1px solid #34343d; border-radius: 999px; padding: 5px 12px; text-decoration: none; cursor: pointer; }
  header .on { border-color: #ffc742; color: #ffc742; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  main a { color: #ffc742; }
  h1, h2, h3 { line-height: 1.25; } h1 { font-size: 26px; } h2 { font-size: 20px; margin-top: 32px; border-bottom: 1px solid #34343d; padding-bottom: 4px; }
  code { background: #27272f; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  pre { background: #27272f; padding: 12px; border-radius: 8px; overflow: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; margin: 12px 0; } td, th { border: 1px solid #34343d; padding: 5px 9px; text-align: left; }
  blockquote { border-left: 3px solid #ffc742; margin: 12px 0; padding: 4px 14px; color: #cfcac0; }
  hr { border: 0; border-top: 1px solid #34343d; margin: 28px 0; }
  .muted { color: #9a958c; }
</style>
</head>
<body>
<header>
  <a href="../">← Игра</a>
  <button data-doc="GDD-current.md">GDD (актуальный)</button>
  <button data-doc="GDD.md">GDD (исходный)</button>
  <button data-doc="DECISIONS.md">Решения</button>
  <button data-doc="CHANGELOG.md">История изменений</button>
</header>
<main id="content"><p class="muted">Загрузка…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  const main = document.getElementById('content'), btns = [...document.querySelectorAll('header button')];
  async function show(doc) {
    btns.forEach(b => b.classList.toggle('on', b.dataset.doc === doc));
    history.replaceState(null, '', '#' + doc);
    try {
      const res = await fetch(doc, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      main.innerHTML = window.marked ? marked.parse(md) : '<pre>' + md.replace(/</g, '&lt;') + '</pre>';
      main.querySelectorAll('a[href$=".md"]').forEach(a => { const d = a.getAttribute('href'); if (!d.includes('/')) a.addEventListener('click', e => { e.preventDefault(); show(d); }); });
      window.scrollTo(0, 0);
    } catch (e) {
      main.innerHTML = `<p>Не удалось загрузить <code>${doc}</code> (${e.message}). При открытии с диска (file://) браузер запрещает fetch — откройте файл напрямую: <a href="${doc}">${doc}</a>.</p>`;
    }
  }
  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.doc)));
  const start = location.hash.slice(1);
  show(btns.some(b => b.dataset.doc === start) ? start : 'GDD-current.md');
})();
</script>
</body>
</html>
